services:
  mongo:
    image: mongo:6.0
    container_name: immobilier-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: immobilier_db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - immobilier-network

  api:
    build: .
    container_name: immobilier-api
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/auth/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - immobilier-network
    restart: on-failure

  frontend:
    build:
      context: ../immobilier-frontend
    container_name: immobilier-frontend
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://api:8080}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - immobilier-network
    restart: on-failure

networks:
  immobilier-network:
    driver: bridge

volumes:
  mongo-data:
