# ═══════════════════════════════════════════════════════════════
#  Serveur
# ═══════════════════════════════════════════════════════════════
server.port=8080
server.servlet.context-path=/

# ═══════════════════════════════════════════════════════════════
#  Jersey (JAX-RS)
#  Mode Servlet (défaut) — Spring Security (filtre) s'exécute
#  toujours EN AMONT du servlet Jersey, donc la sécurité fonctionne
# ═══════════════════════════════════════════════════════════════
spring.jersey.application-path=/

# ═══════════════════════════════════════════════════════════════
#  Application
# ═══════════════════════════════════════════════════════════════
spring.application.name=immobilier-api

# ═══════════════════════════════════════════════════════════════
#  MongoDB
# ═══════════════════════════════════════════════════════════════
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/immobilier_db}

# ═══════════════════════════════════════════════════════════════
#  JWT
# ═══════════════════════════════════════════════════════════════
jwt.secret=${JWT_SECRET:votre_clé_secrète_très_sécurisée_min_32_caractères!@#$%}
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# ═══════════════════════════════════════════════════════════════
#  Logs
# ═══════════════════════════════════════════════════════════════
logging.level.root=INFO
logging.level.com.immobilier=DEBUG
logging.level.org.glassfish.jersey.server=INFO
logging.level.org.glassfish.jersey=INFO

# ═══════════════════════════════════════════════════════════════
#  Jackson (sérialisation JSON)
# ═══════════════════════════════════════════════════════════════
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
