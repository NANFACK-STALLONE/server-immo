# ═══════════════════════════════════════════════════════════════
#  Serveur
# ═══════════════════════════════════════════════════════════════
server.port=8080

# Pas de context-path global : les resources JAX-RS utilisent
# @Path("/api/...") directement
server.servlet.context-path=/

# ═══════════════════════════════════════════════════════════════
#  Jersey (JAX-RS)
# ═══════════════════════════════════════════════════════════════
# Jersey est enregistré comme filtre Servlet (pas comme Servlet)
# => Spring Security peut intercepter les requêtes en amont
spring.jersey.type=filter
spring.jersey.application-path=/

# ═══════════════════════════════════════════════════════════════
#  Application
# ═══════════════════════════════════════════════════════════════
spring.application.name=immobilier-api

# ═══════════════════════════════════════════════════════════════
#  MongoDB
# ═══════════════════════════════════════════════════════════════
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/immobilier_db}

# ═══════════════════════════════════════════════════════════════
#  JWT
# ═══════════════════════════════════════════════════════════════
jwt.secret=${JWT_SECRET:votre_clé_secrète_très_sécurisée_min_32_caractères!@#$%}
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# ═══════════════════════════════════════════════════════════════
#  Logs
# ═══════════════════════════════════════════════════════════════
logging.level.root=INFO
logging.level.com.immobilier=DEBUG
logging.level.org.glassfish.jersey=WARN

# ═══════════════════════════════════════════════════════════════
#  Jackson (sérialisation JSON)
# ═══════════════════════════════════════════════════════════════
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
