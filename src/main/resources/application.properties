# Server
server.port=8080
server.servlet.context-path=/

# Jersey (JAX-RS)
spring.jersey.application-path=/

# Application
spring.application.name=immobilier-api

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/immobilier_db}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Default admin account
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.email=${APP_ADMIN_EMAIL:admin@immo.com}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.fullname=${APP_ADMIN_FULLNAME:Administrateur}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Logs
logging.level.root=INFO
logging.level.com.immobilier=${APP_LOG_LEVEL:INFO}
logging.level.org.glassfish.jersey.server=INFO
logging.level.org.glassfish.jersey=INFO

# Jackson
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
